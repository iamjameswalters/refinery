{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="d-flex pt-5 justify-content-center h-100">
    <div>
        <h2 class="text-center mb-5">Start a New Book</h2>
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Let's go!" %}
        </form>
    </div>
</div>
{% endblock %}
